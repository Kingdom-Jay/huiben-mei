<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回本没</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --primary: #4A90D9;
  --primary-dark: #357ABD;
  --danger: #E74C3C;
  --success: #27AE60;
  --bg: #F5F7FA;
  --card-bg: #FFFFFF;
  --text: #2C3E50;
  --text-secondary: #7F8C8D;
  --border: #E1E8ED;
  --radius: 12px;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.container {
  width: 100%;
  max-width: 480px;
}

.header {
  text-align: center;
  padding: 32px 0 24px;
}

.header h1 {
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.5px;
}

.header .subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 6px;
}

.card {
  background: var(--card-bg);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px;
  margin-bottom: 16px;
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .icon {
  font-size: 18px;
}

/* Upload Area */
.upload-area {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 28px 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
  background: #FAFBFC;
}

.upload-area:hover,
.upload-area.dragover {
  border-color: var(--primary);
  background: #EEF4FB;
}

.upload-area .upload-icon {
  font-size: 36px;
  margin-bottom: 8px;
  display: block;
}

.upload-area .upload-text {
  font-size: 14px;
  color: var(--text-secondary);
}

.upload-area .upload-hint {
  font-size: 12px;
  color: #B0B8C1;
  margin-top: 4px;
}

.upload-area input[type="file"] {
  display: none;
}

.preview-container {
  position: relative;
  display: none;
  margin-top: 12px;
}

.preview-container img {
  width: 100%;
  max-height: 240px;
  object-fit: contain;
  border-radius: 8px;
  border: 1px solid var(--border);
}

.preview-container .remove-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: rgba(0,0,0,0.5);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.preview-container .remove-btn:hover {
  background: rgba(0,0,0,0.7);
}

.ocr-status {
  display: none;
  margin-top: 10px;
  padding: 10px 14px;
  background: #EEF4FB;
  border-radius: 8px;
  font-size: 13px;
  color: var(--primary);
  align-items: center;
  gap: 8px;
}

.ocr-status.show { display: flex; }

.ocr-status .spinner {
  width: 16px;
  height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.ocr-status.success {
  background: #E8F8F0;
  color: var(--success);
}

.ocr-status.error {
  background: #FDEAEA;
  color: var(--danger);
}

/* Form */
.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input {
  width: 100%;
  height: 44px;
  padding: 0 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  color: var(--text);
  background: #FAFBFC;
  transition: border-color 0.2s, box-shadow 0.2s;
  outline: none;
}

.form-group input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(74,144,217,0.12);
  background: #fff;
}

.form-group input::placeholder {
  color: #B0B8C1;
}

.form-group .input-suffix {
  position: relative;
}

.form-group .input-suffix input {
  padding-right: 36px;
}

.form-group .input-suffix .suffix {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 14px;
  color: var(--text-secondary);
  pointer-events: none;
}

/* Mode Selector */
.mode-selector {
  display: flex;
  gap: 10px;
}

.mode-btn {
  flex: 1;
  height: 44px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: #FAFBFC;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.mode-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.mode-btn.active {
  border-color: var(--primary);
  background: #EEF4FB;
  color: var(--primary);
  font-weight: 600;
}

.mode-btn .mode-icon {
  font-size: 16px;
}

.mode-panel {
  padding-top: 4px;
}

/* Calc Button */
.calc-btn {
  width: 100%;
  height: 48px;
  border: none;
  border-radius: 8px;
  background: var(--primary);
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 1px;
}

.calc-btn:hover {
  background: var(--primary-dark);
}

.calc-btn:active {
  transform: scale(0.98);
}

.calc-btn:disabled {
  background: #B0B8C1;
  cursor: not-allowed;
}

/* Result */
.result-card {
  display: none;
  background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
  border-radius: var(--radius);
  padding: 24px 20px;
  color: #fff;
  margin-bottom: 16px;
}

.result-card.show {
  display: block;
}

.result-card .result-label {
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 4px;
}

.result-card .result-value {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.result-card .result-detail {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.result-card .detail-item {
  background: rgba(255,255,255,0.15);
  border-radius: 8px;
  padding: 12px;
}

.result-card .detail-item .detail-label {
  font-size: 12px;
  opacity: 0.8;
  margin-bottom: 4px;
}

.result-card .detail-item .detail-value {
  font-size: 16px;
  font-weight: 600;
}

.result-card.warning {
  background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #2C3E50;
  color: #fff;
  padding: 10px 20px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
}

/* Footer */
.footer {
  text-align: center;
  padding: 16px 0;
  font-size: 12px;
  color: #B0B8C1;
}

/* 说明卡片 */
.info-card {
  background: #FFFDF5;
  border: 1px solid #F0E68C;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 12px;
  color: #8B7355;
  line-height: 1.6;
  margin-top: 12px;
  display: none;
}

.info-card.show {
  display: block;
}

/* 基金持仓列表 */
.count-badge {
  margin-left: auto;
  background: #EEF4FB;
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  padding: 2px 10px;
  border-radius: 10px;
}

.fund-item {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
  background: #FAFBFC;
}

.fund-item-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.fund-idx {
  flex: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--primary);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fund-item-head input {
  flex: 1;
  min-width: 0;
  height: 36px;
  padding: 0 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
  outline: none;
}

.fund-item-head input:focus { border-color: var(--primary); }

.fund-del {
  flex: none;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: none;
  background: #FDEAEA;
  color: var(--danger);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
}

.fund-del:hover { background: #F8D7DA; }

.fund-item-body {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.fund-field label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
}

.fund-field input {
  width: 100%;
  height: 36px;
  padding: 0 10px;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  font-size: 14px;
  background: #fff;
  outline: none;
}

.fund-field input:focus { border-color: var(--primary); }

.add-fund-btn {
  width: 100%;
  height: 40px;
  border: 1.5px dashed var(--border);
  border-radius: 8px;
  background: transparent;
  color: var(--text-secondary);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.add-fund-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.fund-empty {
  text-align: center;
  color: #B0B8C1;
  font-size: 13px;
  padding: 16px 0;
}

/* 回本情况清单 */
.result-row {
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}

.result-row:last-child { margin-bottom: 0; }

.result-row-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.result-row-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.result-row-tag {
  flex: none;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 8px;
}

.result-row-tag.need { background: #FDEAEA; color: var(--danger); }
.result-row-tag.ok { background: #E8F8F0; color: var(--success); }
.result-row-tag.warn { background: #FFF3CD; color: #856404; }

.result-row-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.result-row-metrics > div {
  background: #F5F7FA;
  border-radius: 6px;
  padding: 8px 4px;
  text-align: center;
}

.result-row-metrics span {
  display: block;
  font-size: 11px;
  color: var(--text-secondary);
  margin-bottom: 2px;
}

.result-row-metrics b {
  font-size: 13px;
  color: var(--text);
  word-break: break-all;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>回本没</h1>
    <p class="subtitle">基金套牢了？一键算一算，要投入多少才能回本</p>
  </div>

  <!-- 上传区域 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">&#128247;</span> 上传持仓截图
    </div>
    <div class="upload-area" id="uploadArea">
      <span class="upload-icon">&#128196;</span>
      <div class="upload-text">拖拽图片到此处，或点击上传</div>
      <div class="upload-hint">支持多张 JPG、PNG 截图，自动识别全部基金</div>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>
    <div class="preview-container" id="previewContainer">
      <img id="previewImg" src="" alt="预览">
      <button class="remove-btn" id="removeBtn">&times;</button>
    </div>
    <div class="ocr-status" id="ocrStatus">
      <span class="spinner" id="ocrSpinner"></span>
      <span id="ocrStatusText">正在识别图片中的文字...</span>
    </div>
  </div>

  <!-- 基金持仓列表 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">&#128203;</span> 基金持仓列表
      <span class="count-badge" id="fundCount">0</span>
    </div>
    <div id="fundList"></div>
    <button class="add-fund-btn" id="addFundBtn">+ 手动添加基金</button>
  </div>

  <!-- 投资模式 -->
  <div class="card">
    <div class="card-title">
      <span class="icon">&#128200;</span> 投资模式
    </div>
    <div class="mode-selector">
      <button class="mode-btn active" data-mode="lump-sum" id="modeLumpSum">
        <span class="mode-icon">&#128176;</span> 一次性买入
      </button>
      <button class="mode-btn" data-mode="dca" id="modeDCA">
        <span class="mode-icon">&#128260;</span> 定投模式
      </button>
    </div>

    <!-- 一次性买入模式：输入预期第二日涨幅 -->
    <div class="mode-panel" id="panelLumpSum" style="margin-top:14px;">
      <div class="form-group input-suffix" style="margin-bottom:0;">
        <label>预期第二日涨幅</label>
        <input type="number" id="expectedRise" placeholder="例如：2" step="0.01" min="0.01">
        <span class="suffix">%</span>
      </div>
    </div>

    <!-- 定投模式：输入每日定投金额 + 目标持有收益率 -->
    <div class="mode-panel" id="panelDCA" style="margin-top:14px; display:none;">
      <div class="form-group input-suffix">
        <label>每日定投金额</label>
        <input type="number" id="dailyAmount" placeholder="例如：500" step="1" min="1">
        <span class="suffix">元</span>
      </div>
      <div class="form-group input-suffix" style="margin-bottom:0;">
        <label>目标持有收益率（负数，且需优于当前）</label>
        <input type="number" id="targetYield" placeholder="例如：-10" step="0.01" max="-0.01">
        <span class="suffix">%</span>
      </div>
    </div>
  </div>

  <!-- 计算按钮 -->
  <button class="calc-btn" id="calcBtn">计算回本资金</button>

  <!-- 计算结果汇总 -->
  <div class="result-card" id="resultSummary">
    <div class="result-label" id="summaryLabel">需补仓资金合计</div>
    <div class="result-value" id="summaryValue">¥ 0.00</div>
    <div class="result-detail">
      <div class="detail-item">
        <div class="detail-label">当前亏损合计</div>
        <div class="detail-value" id="summaryLoss">¥ 0.00</div>
      </div>
      <div class="detail-item">
        <div class="detail-label" id="summaryCostLabel">补仓后总成本</div>
        <div class="detail-value" id="summaryCost">¥ 0.00</div>
      </div>
      <div class="detail-item">
        <div class="detail-label">基金只数</div>
        <div class="detail-value" id="summaryCount">0</div>
      </div>
      <div class="detail-item">
        <div class="detail-label" id="summaryNeedLabel">需补仓只数</div>
        <div class="detail-value" id="summaryNeedCount">0</div>
      </div>
    </div>
  </div>

  <!-- 各基金回本情况清单 -->
  <div class="card" id="resultListCard" style="display:none;">
    <div class="card-title">
      <span class="icon">&#128202;</span> 回本情况清单
    </div>
    <div id="resultList"></div>
  </div>

  <!-- 风险提示 -->
  <div class="info-card" id="infoCard">
    <strong>温馨提示：</strong>一次性买入模式基于预期涨幅估算补仓资金；定投模式假设基金单位净值保持不变，仅通过定期加仓摊薄成本。实际市场波动不可预测，基金投资有风险，请结合自身风险承受能力谨慎决策。
  </div>

  <div class="footer">
    回本没 &copy; 2026 &middot; 仅供参考，不构成投资建议
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
(function() {
  // ========== DOM 引用 ==========
  const uploadArea = document.getElementById('uploadArea');
  const fileInput = document.getElementById('fileInput');
  const previewContainer = document.getElementById('previewContainer');
  const previewImg = document.getElementById('previewImg');
  const removeBtn = document.getElementById('removeBtn');
  const ocrStatus = document.getElementById('ocrStatus');
  const ocrSpinner = document.getElementById('ocrSpinner');
  const ocrStatusText = document.getElementById('ocrStatusText');

  const fundListEl = document.getElementById('fundList');
  const fundCountEl = document.getElementById('fundCount');
  const addFundBtn = document.getElementById('addFundBtn');

  // 模式专属输入
  const expectedRiseInput = document.getElementById('expectedRise');
  const dailyAmountInput = document.getElementById('dailyAmount');
  const targetYieldInput = document.getElementById('targetYield');

  const panelLumpSum = document.getElementById('panelLumpSum');
  const panelDCA = document.getElementById('panelDCA');

  const modeLumpSum = document.getElementById('modeLumpSum');
  const modeDCA = document.getElementById('modeDCA');
  const calcBtn = document.getElementById('calcBtn');

  // 结果卡片
  const resultSummary = document.getElementById('resultSummary');
  const summaryLabel = document.getElementById('summaryLabel');
  const summaryValue = document.getElementById('summaryValue');
  const summaryLoss = document.getElementById('summaryLoss');
  const summaryCostLabel = document.getElementById('summaryCostLabel');
  const summaryCost = document.getElementById('summaryCost');
  const summaryCount = document.getElementById('summaryCount');
  const summaryNeedLabel = document.getElementById('summaryNeedLabel');
  const summaryNeedCount = document.getElementById('summaryNeedCount');
  const resultListCard = document.getElementById('resultListCard');
  const resultList = document.getElementById('resultList');

  const infoCard = document.getElementById('infoCard');
  const toast = document.getElementById('toast');

  let currentMode = 'lump-sum';

  // ========== Toast ==========
  let toastTimer;
  function showToast(msg, duration = 2500) {
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(() => toast.classList.remove('show'), duration);
  }

  // ========== 模式切换 ==========
  function switchMode(mode) {
    currentMode = mode;
    if (mode === 'lump-sum') {
      modeLumpSum.classList.add('active');
      modeDCA.classList.remove('active');
      panelLumpSum.style.display = 'block';
      panelDCA.style.display = 'none';
      calcBtn.textContent = '计算回本资金';
    } else {
      modeDCA.classList.add('active');
      modeLumpSum.classList.remove('active');
      panelDCA.style.display = 'block';
      panelLumpSum.style.display = 'none';
      calcBtn.textContent = '计算摊薄所需天数';
    }
    hideAllResults();
  }

  modeLumpSum.addEventListener('click', () => switchMode('lump-sum'));
  modeDCA.addEventListener('click', () => switchMode('dca'));

  function hideAllResults() {
    resultSummary.classList.remove('show', 'warning');
    resultListCard.style.display = 'none';
    infoCard.classList.remove('show');
  }

  // ========== 图片上传（支持多张） ==========
  uploadArea.addEventListener('click', () => fileInput.click());

  uploadArea.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  });

  uploadArea.addEventListener('dragleave', () => {
    uploadArea.classList.remove('dragover');
  });

  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length > 0) handleFiles(files);
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length > 0) handleFiles(Array.from(fileInput.files));
  });

  removeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    resetUpload();
  });

  function readAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function handleFiles(files) {
    ocrStatus.classList.add('show');
    ocrStatus.classList.remove('success', 'error');
    ocrSpinner.style.display = 'inline-block';
    ocrStatusText.textContent = '准备识别...';
    try {
      previewImg.src = await readAsDataURL(files[files.length - 1]);
      previewContainer.style.display = 'block';
      uploadArea.style.display = 'none';

      let added = 0;
      for (let i = 0; i < files.length; i++) {
        ocrStatusText.textContent = `正在识别第 ${i + 1}/${files.length} 张...`;
        const extracted = await runOCR(files[i]);
        extracted.forEach(f => funds.push(f));
        added += extracted.length;
      }
      renderFundList();
      if (added > 0) {
        ocrStatus.classList.add('success');
        ocrStatusText.textContent = `共识别到 ${added} 只基金，请核对修正`;
        showToast(`已识别 ${added} 只基金`);
      } else {
        ocrStatus.classList.add('error');
        ocrStatusText.textContent = '未能识别到基金信息，请手动添加';
      }
    } catch (err) {
      console.error('OCR 失败:', err);
      ocrStatus.classList.add('error');
      ocrStatusText.textContent = '识别失败，请手动添加或重试';
    } finally {
      ocrSpinner.style.display = 'none';
    }
  }

  function resetUpload() {
    previewImg.src = '';
    previewContainer.style.display = 'none';
    uploadArea.style.display = 'block';
    fileInput.value = '';
    ocrStatus.classList.remove('show', 'success', 'error');
  }

  // ========== OCR 识别 ==========
  async function runOCR(file) {
    const { data: { text } } = await Tesseract.recognize(file, 'chi_sim', {
      logger: (m) => {
        if (m.status === 'recognizing text') {
          ocrStatusText.textContent = `正在识别中... ${Math.round(m.progress * 100)}%`;
        }
      }
    });
    console.log('OCR 原始文本:', text);
    return extractAllFunds(text);
  }

  // ========== 多基金提取 ==========
  const NAME_RE = /[\u4e00-\u9fa5]{2,12}(?:精选|蓝筹|成长|价值|红利|稳健|灵活|优选|增强|量化|混合|股票|债券|指数|ETF|联接|LOF|QDII|FOF)[\u4e00-\u9fa5A-Za-z]*/;
  const TAG_RE = /金选|定投|极速交易|自选|金额排序|我的持有|产品提醒|申购|限额/;
  const AMOUNT_KW = /(持有金额|持仓金额|持有市值|持仓市值|最新市值|资产净值|市值)/;
  const PROFIT_KW = /(持有收益(?!率)|累计收益(?!率)|持仓收益(?!率)|浮动收益|持有盈亏|盈亏(?!率))/;

  function kwNumber(line, kwRe) {
    const m = line.match(kwRe);
    if (!m) return null;
    const rest = line.slice(m.index + m[0].length);
    const nm = rest.match(/-?\d+(?:[,，]\d{3})*(?:\.\d+)?/);
    return nm ? parseFloat(nm[0].replace(/[,，]/g, '')) : null;
  }

  function plainNumbers(line) {
    // 剔除百分数（收益率），避免与收益金额混淆
    const cleaned = line.replace(/-?\d+(?:\.\d+)?\s*[%％]/g, ' ');
    const out = [];
    const re = /-?\d+(?:[,，]\d{3})*(?:\.\d+)?/g;
    let m;
    while ((m = re.exec(cleaned)) !== null) out.push(parseFloat(m[0].replace(/[,，]/g, '')));
    return out;
  }

  // 去掉数字与百分号，只留文字部分（用于名称判断）
  function cleanText(line) {
    return line.replace(/-?\d+(?:[,，]\d{3})*(?:\.\d+)?/g, '').replace(/[%％]/g, '').trim();
  }

  // OCR 中文常逐字带空格（如“天 弘 国 证 绿色 电力 ETF”），
  // 归一化：删除与汉字相邻的空白，保留数字之间的空白以分隔金额
  function normalizeLine(line) {
    return line
      .replace(/([\u4e00-\u9fa5])[ \t]+/g, '$1')
      .replace(/[ \t]+([\u4e00-\u9fa5])/g, '$1')
      .trim();
  }

  function extractAllFunds(text) {
    const lines = text.split(/\r?\n/).map(l => normalizeLine(l)).filter(Boolean);
    const results = [];

    // 按基金名称行分组：每个名称行到下一个名称行之间为一个持仓块
    const nameIdx = [];
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (TAG_RE.test(line)) continue;
      if (NAME_RE.test(line)) { nameIdx.push(i); continue; }
      // 跨行名称：本行文字部分纯中文、下一行含名称关键词时，两行合并为一个名称块
      if (/^[\u4e00-\u9fa5]{4,}$/.test(cleanText(line)) && i + 1 < lines.length &&
          !TAG_RE.test(lines[i + 1]) && NAME_RE.test(lines[i + 1])) {
        nameIdx.push(i);
        i++; // 下一行并入本块，不再单独成块
      }
    }

    nameIdx.forEach((start, k) => {
      const end = k + 1 < nameIdx.length ? nameIdx[k + 1] : Math.min(start + 8, lines.length);
      const windowLines = lines.slice(start, end);

      let name = (windowLines[0].match(NAME_RE) || [null])[0] || cleanText(windowLines[0]);
      // 第二行若是份额后缀或名称续行（如“联接C”“现金流指数C”，可能带列尾数字），拼接到名称
      const second = windowLines[1];
      if (second) {
        const sec = cleanText(second);
        if (sec && sec.length <= 12 && !TAG_RE.test(second) && !TAG_RE.test(sec) &&
            (/^(联接|混合|股票|指数)[A-C]$/.test(sec) || /^[\(（]?QDII[\)）]?[A-C]$/.test(sec) || NAME_RE.test(sec))) {
          name += sec;
        }
      }

      let amount = null, profit = null;
      // 优先关键词提取
      for (const line of windowLines) {
        if (amount === null) { const v = kwNumber(line, AMOUNT_KW); if (v !== null) amount = v; }
        if (profit === null) { const v = kwNumber(line, PROFIT_KW); if (v !== null) profit = v; }
      }
      // 兜底：按位置取数（第一个正数=金额，第一个负数=收益）
      if (amount === null || profit === null) {
        const nums = [];
        windowLines.forEach(line => plainNumbers(line).forEach(n => nums.push(n)));
        if (amount === null) { const v = nums.find(n => n > 0); if (v !== undefined) amount = v; }
        if (profit === null) { const v = nums.find(n => n < 0); if (v !== undefined) profit = v; }
      }

      if (amount !== null && amount > 0) {
        results.push({ name: name.trim(), amount, profit: profit === null ? 0 : profit });
      }
    });

    // 兜底：无名称行时按关键词配对分组
    if (results.length === 0) {
      let amount = null, profit = null, idx = 0;
      for (const line of lines) {
        const a = kwNumber(line, AMOUNT_KW);
        const p = kwNumber(line, PROFIT_KW);
        if (a !== null) amount = a;
        if (p !== null) profit = p;
        if (amount !== null && profit !== null) {
          idx++;
          results.push({ name: '基金' + idx, amount, profit });
          amount = null; profit = null;
        }
      }
    }

    return results;
  }

  // ========== 基金列表管理 ==========
  let funds = [];

  function addFund(data) {
    funds.push({
      name: (data && data.name) || '',
      amount: (data && data.amount !== undefined && data.amount !== null) ? data.amount : '',
      profit: (data && data.profit !== undefined && data.profit !== null) ? data.profit : '',
    });
    renderFundList();
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderFundList() {
    fundCountEl.textContent = funds.length;
    if (funds.length === 0) {
      fundListEl.innerHTML = '<div class="fund-empty">暂无基金，请上传截图或点击下方按钮手动添加</div>';
      return;
    }
    fundListEl.innerHTML = funds.map((f, i) => `
      <div class="fund-item">
        <div class="fund-item-head">
          <span class="fund-idx">${i + 1}</span>
          <input type="text" class="fund-name" data-idx="${i}" placeholder="基金名称" value="${escapeHtml(f.name)}">
          <button class="fund-del" data-idx="${i}" title="删除该基金">&times;</button>
        </div>
        <div class="fund-item-body">
          <div class="fund-field">
            <label>持有金额（元）</label>
            <input type="number" class="fund-amount" data-idx="${i}" step="0.01" placeholder="3423.78" value="${escapeHtml(f.amount)}">
          </div>
          <div class="fund-field">
            <label>持有收益（元，亏损为负）</label>
            <input type="number" class="fund-profit" data-idx="${i}" step="0.01" placeholder="-163.94" value="${escapeHtml(f.profit)}">
          </div>
        </div>
      </div>`).join('');
  }

  function syncFundsFromDOM() {
    fundListEl.querySelectorAll('.fund-item').forEach((item, i) => {
      if (!funds[i]) return;
      funds[i].name = item.querySelector('.fund-name').value;
      funds[i].amount = item.querySelector('.fund-amount').value;
      funds[i].profit = item.querySelector('.fund-profit').value;
    });
  }

  fundListEl.addEventListener('click', (e) => {
    const del = e.target.closest('.fund-del');
    if (del) {
      syncFundsFromDOM();
      funds.splice(parseInt(del.dataset.idx, 10), 1);
      renderFundList();
    }
  });

  fundListEl.addEventListener('input', () => {
    syncFundsFromDOM();
    if (resultSummary.classList.contains('show')) calculate();
  });

  addFundBtn.addEventListener('click', () => addFund(null));

  // ========== 单只基金回本计算 ==========
  function computeFund(fund, mode, params) {
    const name = (fund.name || '').trim() || '未命名基金';
    const M = parseFloat(fund.amount);
    const P = parseFloat(fund.profit);

    if (isNaN(M) || M <= 0 || isNaN(P)) {
      return { name, status: 'incomplete', tag: '信息不全', tagClass: 'warn', metrics: [] };
    }

    const I = M - P; // 初始投入本金
    if (P >= 0 || I <= 0) {
      return {
        name, status: 'ok', tag: '已盈利，无需补仓', tagClass: 'ok', loss: 0, need: 0, cost: I > 0 ? I : M,
        metrics: [
          ['当前盈利', '¥ ' + formatMoney(P)],
          ['持有金额', '¥ ' + formatMoney(M)],
          ['需补仓', '¥ 0.00'],
        ],
      };
    }

    if (mode === 'lump-sum') {
      const r = params.r;
      // 公式: X = (|P| - M * r) / r
      const X = (Math.abs(P) - M * r) / r;
      if (X <= 0) {
        return {
          name, status: 'ok', tag: '无需补仓', tagClass: 'ok', loss: Math.abs(P), need: 0, cost: I,
          metrics: [
            ['当前亏损', '-¥ ' + formatMoney(Math.abs(P))],
            ['需补仓', '¥ 0.00'],
            ['上涨后市值', '¥ ' + formatMoney(M * (1 + r))],
          ],
        };
      }
      return {
        name, status: 'need', tag: '需补仓', tagClass: 'need', loss: Math.abs(P), need: X, cost: I + X,
        metrics: [
          ['当前亏损', '-¥ ' + formatMoney(Math.abs(P))],
          ['需补仓', '¥ ' + formatMoney(X)],
          ['补仓后总成本', '¥ ' + formatMoney(I + X)],
        ],
      };
    }

    // 定投模式: n = (P / rTarget - I) / D
    const rTarget = params.rTarget;
    const rCurrent = P / I;
    if (rTarget <= rCurrent) {
      return {
        name, status: 'ok', tag: '已达目标收益率', tagClass: 'ok', loss: Math.abs(P), need: 0, cost: I,
        metrics: [
          ['当前收益率', (rCurrent * 100).toFixed(2) + '%'],
          ['所需天数', '0 天'],
          ['累计定投', '¥ 0.00'],
        ],
      };
    }
    const n = (P / rTarget - I) / params.D;
    if (!(n > 0)) {
      return { name, status: 'incomplete', tag: '计算异常', tagClass: 'warn', metrics: [] };
    }
    const days = Math.ceil(n);
    const dcaTotal = params.D * days;
    return {
      name, status: 'need', tag: '需定投', tagClass: 'need', loss: Math.abs(P), need: dcaTotal, cost: I + dcaTotal,
      metrics: [
        ['当前收益率', (rCurrent * 100).toFixed(2) + '%'],
        ['所需天数', days + ' 天'],
        ['累计定投', '¥ ' + formatMoney(dcaTotal)],
      ],
    };
  }

  // ========== 统一入口：计算所有基金的回本情况 ==========
  function calculate() {
    syncFundsFromDOM();
    hideAllResults();

    if (funds.length === 0) {
      showToast('请先上传截图或添加至少一只基金');
      return;
    }

    let params;
    if (currentMode === 'lump-sum') {
      const rPct = parseFloat(expectedRiseInput.value);
      if (isNaN(rPct) || rPct <= 0) { showToast('请输入有效的预期涨幅（大于0）'); return; }
      params = { r: rPct / 100 };
    } else {
      const D = parseFloat(dailyAmountInput.value);
      const tPct = parseFloat(targetYieldInput.value);
      if (isNaN(D) || D <= 0) { showToast('请输入有效的每日定投金额'); return; }
      if (isNaN(tPct) || tPct >= 0) { showToast('目标持有收益率必须为负数（亏损状态）'); return; }
      params = { D, rTarget: tPct / 100 };
    }

    const rows = funds.map(f => computeFund(f, currentMode, params));

    // 渲染逐基金清单
    resultList.innerHTML = rows.map(row => `
      <div class="result-row">
        <div class="result-row-head">
          <span class="result-row-name">${escapeHtml(row.name)}</span>
          <span class="result-row-tag ${row.tagClass}">${row.tag}</span>
        </div>
        ${row.metrics.length ? '<div class="result-row-metrics">' + row.metrics.map(m => '<div><span>' + m[0] + '</span><b>' + m[1] + '</b></div>').join('') + '</div>' : ''}
      </div>`).join('');
    resultListCard.style.display = 'block';

    // 汇总
    const valid = rows.filter(r => r.status !== 'incomplete');
    const totalLoss = valid.reduce((s, r) => s + (r.loss || 0), 0);
    const totalNeed = valid.reduce((s, r) => s + (r.need || 0), 0);
    const totalCost = valid.reduce((s, r) => s + (r.cost || 0), 0);
    const needCount = valid.filter(r => r.status === 'need').length;

    if (currentMode === 'lump-sum') {
      summaryLabel.textContent = '需补仓资金合计';
      summaryValue.textContent = totalNeed > 0 ? ('¥ ' + formatMoney(totalNeed)) : '无需补仓';
      summaryCostLabel.textContent = '补仓后总成本';
      summaryNeedLabel.textContent = '需补仓只数';
    } else {
      summaryLabel.textContent = '累计定投合计';
      summaryValue.textContent = totalNeed > 0 ? ('¥ ' + formatMoney(totalNeed)) : '无需定投';
      summaryCostLabel.textContent = '累计投入成本';
      summaryNeedLabel.textContent = '需定投只数';
    }
    summaryLoss.textContent = '-¥ ' + formatMoney(totalLoss);
    summaryCost.textContent = '¥ ' + formatMoney(totalCost);
    summaryCount.textContent = funds.length + ' 只';
    summaryNeedCount.textContent = needCount + ' 只';

    if (needCount === 0) resultSummary.classList.add('warning');
    resultSummary.classList.add('show');
    infoCard.classList.add('show');
  }

  function formatMoney(num) {
    return num.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  }

  calcBtn.addEventListener('click', calculate);

  // ========== 键盘快捷计算 ==========
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && document.activeElement && document.activeElement.tagName === 'INPUT') {
      e.preventDefault();
      calculate();
    }
  });

  // ========== 参数输入时实时更新结果 ==========
  [expectedRiseInput, dailyAmountInput, targetYieldInput].forEach(input => {
    input.addEventListener('input', () => {
      if (resultSummary.classList.contains('show')) calculate();
    });
  });

  // 初始渲染空列表
  renderFundList();

})();
</script>

</body>
</html>
